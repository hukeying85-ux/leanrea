<div class="grid"><figure><img src="系列05_01.png" alt="对方撤退时 拆开追逃循环"><figcaption><b>对方撤退时 拆开追逃循环</b><br>小熊追得越急，小刺猬缩得越紧<br></figcaption></figure><figure><img src="系列05_02.png" alt="越追越退"><figcaption><b>越追越退</b><br>追得越紧，退得越远<br>别跟着我…… / 我不追了， 就在这儿。</figcaption></figure><figure><img src="系列05_03.png" alt="停止翻译"><figcaption><b>停止翻译</b><br>沉默，不是在离开<br>别问了好不好…… / 好。我知道， 你不是在推开我。</figcaption></figure><figure><img src="系列05_04.png" alt="降噪模式"><figcaption><b>降噪模式</b><br>先稳自己，再接对方<br>别说了别说了…… / 好，一起 静六秒钟。</figcaption></figure><figure><img src="系列05_05.png" alt="只问一遍"><figcaption><b>只问一遍</b><br>追问是压力，不是关心<br>走吧，别管我。 / 我只问一遍： 想说的时候，我在。</figcaption></figure><figure><img src="系列05_06.png" alt="退一步"><figcaption><b>退一步</b><br>退出追，不退出关系<br>我要回房间了。 / 好。我不走远， 就在客厅。</figcaption></figure><figure><img src="系列05_07.png" alt="把循环说出口"><figcaption><b>把循环说出口</b><br>说「我们」，不说「你」<br>又来了…… / 嗯，我们又在 绕圈了，停一下。</figcaption></figure><figure><img src="系列05_08.png" alt="TA回来时"><figcaption><b>TA回来时</b><br>不审问，不记仇<br>我好了。 / 嗯。 热可可给你。</figcaption></figure><figure><img src="系列05_09.png" alt="引导者也会累"><figcaption><b>引导者也会累</b><br>你的不安，也要安放<br>你耳朵垂下来了。 / 有点难。 但说出来就好。</figcaption></figure><figure><img src="系列05_10.png" alt="拆开循环"><figcaption><b>拆开循环</b><br>一个停，就都停了<br>下次又绕圈怎么办？ / 就说那句话： 「我们在绕圈了」。</figcaption></figure></div>
