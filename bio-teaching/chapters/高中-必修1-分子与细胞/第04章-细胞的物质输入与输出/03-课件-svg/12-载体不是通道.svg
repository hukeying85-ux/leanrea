<svg xmlns="http://www.w3.org/2000/svg" lang="zh-CN" viewBox="0 0 1280 720" width="1280" height="720" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" data-pptx-page-role="content">
<rect x="0" y="0" width="1280" height="720" fill="#F4EFE4" id="bg" data-pptx-role="background" />
<g id="content" data-pptx-bounds="0 0 1280 720">
<rect x="76" y="87" width="7" height="7" fill="#B8452A" /><text x="92" y="96" font-size="13" font-weight="500" fill="#B8452A" letter-spacing="3.2">最容易混的一页</text>
<text x="76" y="168" font-family="Songti SC, STSong, SimSun, serif" font-size="34" font-weight="700" fill="#14302F">载体不是通道</text>
<line x1="640.0" y1="224.08" x2="640.0" y2="486.08000000000004" stroke="#D5CCBA" stroke-width="1" />
<text x="76.0" y="250.08" font-size="13" font-weight="500" fill="#B8452A" letter-spacing="2.4">载体蛋白</text>
<text x="76.0" y="306.08000000000004" font-family="Songti SC, STSong, SimSun, serif" font-size="32" font-weight="700" fill="#14302F">结合—变形—释放</text>
<text x="76.0" y="356.08000000000004" font-size="18" font-weight="400" fill="#4E625F">自身构象改变</text>
<text x="76.0" y="392.08000000000004" font-size="18" font-weight="400" fill="#4E625F">每轮都要「抓」一次</text>
<text x="76.0" y="428.08000000000004" font-size="18" font-weight="400" fill="#4E625F">有特异性</text>
<text x="674.0" y="250.08" font-size="13" font-weight="500" fill="#2C6157" letter-spacing="2.4">通道蛋白</text>
<text x="674.0" y="306.08000000000004" font-family="Songti SC, STSong, SimSun, serif" font-size="32" font-weight="700" fill="#14302F">开，或者关</text>
<text x="674.0" y="356.08000000000004" font-size="18" font-weight="400" fill="#4E625F">形成水相孔道</text>
<text x="674.0" y="392.08000000000004" font-size="18" font-weight="400" fill="#4E625F">不结合底物</text>
<text x="674.0" y="428.08000000000004" font-size="18" font-weight="400" fill="#4E625F">同样有选择性</text>
<line x1="76" y1="654" x2="1204" y2="654" stroke="#D5CCBA" stroke-width="1" /><text x="76" y="682" font-size="12" font-weight="400" fill="#4E625F" letter-spacing="1.6" fill-opacity="0.8">一株海水稻，怎么在盐里活着</text><text x="1204" y="682" font-size="12" font-weight="400" fill="#4E625F" text-anchor="end" letter-spacing="1.2" fill-opacity="0.8">12 — 24</text>
</g>
</svg>
