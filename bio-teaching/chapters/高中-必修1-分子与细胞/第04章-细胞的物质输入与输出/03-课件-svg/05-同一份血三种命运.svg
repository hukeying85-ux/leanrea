<rect x="76" y="87" width="7" height="7" fill="#B8452A" /><text x="92" y="96" font-size="13" font-weight="500" fill="#B8452A" letter-spacing="3.2">红细胞的三张照片</text>
<text x="76" y="168" font-family="Songti SC, STSong, SimSun, serif" font-size="34" font-weight="700" fill="#14302F">同一份血，三种命运</text>
<line x1="640.0" y1="224.08" x2="640.0" y2="486.08000000000004" stroke="#D5CCBA" stroke-width="1" />
<text x="76.0" y="250.08" font-size="13" font-weight="500" fill="#B8452A" letter-spacing="2.4">清水</text>
<text x="76.0" y="306.08000000000004" font-family="Songti SC, STSong, SimSun, serif" font-size="32" font-weight="700" fill="#14302F">吸水胀破</text>
<text x="76.0" y="356.08000000000004" font-size="18" font-weight="400" fill="#4E625F">外面水多</text>
<text x="76.0" y="392.08000000000004" font-size="18" font-weight="400" fill="#4E625F">水净向内</text>
<text x="76.0" y="428.08000000000004" font-size="18" font-weight="400" fill="#4E625F">细胞撑不住</text>
<text x="674.0" y="250.08" font-size="13" font-weight="500" fill="#2C6157" letter-spacing="2.4">0.9% 盐水</text>
