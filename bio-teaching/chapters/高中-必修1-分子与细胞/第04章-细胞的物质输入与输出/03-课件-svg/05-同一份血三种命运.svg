<svg xmlns="http://www.w3.org/2000/svg" lang="zh-CN" viewBox="0 0 1280 720" width="1280" height="720" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" data-pptx-page-role="content">
<rect x="0" y="0" width="1280" height="720" fill="#F7F3EC" id="bg" data-pptx-role="background" />
<g id="content" data-pptx-bounds="0 0 1280 720">
<text x="96" y="76" font-size="19" font-weight="500" fill="#C2542F" letter-spacing="2">红细胞的三张照片</text>
<text x="96" y="160" font-family="Songti SC, STSong, SimSun, serif" font-size="38" font-weight="700" fill="#16262A">同一份血，三种命运</text>
<line x1="640" y1="232.56" x2="640" y2="502.56" stroke="#D8D0C0" stroke-width="1.5" />
<text x="96.0" y="242.56" font-size="22" font-weight="500" fill="#C2542F">清水</text>
<text x="96.0" y="304.56" font-family="Songti SC, STSong, SimSun, serif" font-size="34" font-weight="700" fill="#16262A">吸水胀破</text>
<text x="96.0" y="350.56" font-size="19" font-weight="400" fill="#4A5C60">外面水多</text>
<text x="96.0" y="384.56" font-size="19" font-weight="400" fill="#4A5C60">水净向内</text>
<text x="96.0" y="418.56" font-size="19" font-weight="400" fill="#4A5C60">细胞撑不住</text>
<text x="640.0" y="242.56" font-size="22" font-weight="500" fill="#2E6B66">0.9% 盐水</text>
<text x="640.0" y="304.56" font-family="Songti SC, STSong, SimSun, serif" font-size="34" font-weight="700" fill="#16262A">形状不变</text>
<text x="640.0" y="350.56" font-size="19" font-weight="400" fill="#4A5C60">进出相等</text>
<text x="640.0" y="384.56" font-size="19" font-weight="400" fill="#4A5C60">不是水不动了</text>
<text x="640.0" y="418.56" font-size="19" font-weight="400" fill="#4A5C60">而是净移动为零</text>
<line x1="96" y1="664" x2="1184" y2="664" stroke="#D8D0C0" stroke-width="1" /><text x="96" y="690" font-size="14" font-weight="400" fill="#4A5C60" fill-opacity="0.75">一株海水稻，怎么在盐里活着</text><text x="1184" y="690" font-size="14" font-weight="400" fill="#4A5C60" text-anchor="end" fill-opacity="0.75">05 / 24</text>
</g>
</svg>
