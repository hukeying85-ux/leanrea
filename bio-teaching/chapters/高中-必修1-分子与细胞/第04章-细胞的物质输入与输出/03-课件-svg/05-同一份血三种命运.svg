<text x="674.0" y="356.08000000000004" font-size="18" font-weight="400" fill="#4E625F">进出相等</text>
<text x="674.0" y="392.08000000000004" font-size="18" font-weight="400" fill="#4E625F">不是水不动了</text>
<text x="674.0" y="428.08000000000004" font-size="18" font-weight="400" fill="#4E625F">而是净移动为零</text>
