<svg xmlns="http://www.w3.org/2000/svg" lang="zh-CN" viewBox="0 0 1280 720" width="1280" height="720" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" data-pptx-page-role="content">
<rect x="0" y="0" width="1280" height="720" fill="#F7F3EC" id="bg" data-pptx-role="background" />
<g id="content" data-pptx-bounds="0 0 1280 720">
<text x="96" y="76" font-size="19" font-weight="500" fill="#C2542F" letter-spacing="2">两个反例，先判后讲</text>
<text x="96" y="160" font-family="Songti SC, STSong, SimSun, serif" font-size="38" font-weight="700" fill="#16262A">两个反例</text>
<text x="96" y="246.56" font-size="26" font-weight="700" fill="#C2542F">✗</text>
<text x="136" y="246.56" font-size="22" font-weight="400" fill="#4A5C60">水只能自由扩散</text>
<text x="600" y="246.56" font-size="24" font-weight="700" fill="#2E6B66">→</text>
<text x="646" y="246.56" font-size="22" font-weight="500" fill="#16262A">水还有水通道蛋白这条协助扩散的路</text>
<line x1="96" y1="286.56" x2="1184" y2="286.56" stroke="#D8D0C0" stroke-width="0.8" />
<text x="96" y="302.56" font-size="26" font-weight="700" fill="#C2542F">✗</text>
<text x="136" y="302.56" font-size="22" font-weight="400" fill="#4A5C60">有载体就一定耗能</text>
<text x="600" y="302.56" font-size="24" font-weight="700" fill="#2E6B66">→</text>
<text x="646" y="302.56" font-size="22" font-weight="500" fill="#16262A">协助扩散有载体，不耗能</text>
<line x1="96" y1="342.56" x2="1184" y2="342.56" stroke="#D8D0C0" stroke-width="0.8" />
