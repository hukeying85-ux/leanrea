<rect x="76" y="87" width="6" height="6" fill="#16282A" /><text x="92" y="96" font-size="12.88" font-weight="500" fill="#16282A" letter-spacing="2.27">两个反例，先判后讲</text>
<text x="76" y="170" font-family="Songti SC, STSong, SimSun, serif" font-size="33.99" font-weight="700" fill="#16282A" letter-spacing="0.68">十四、两个反例</text>
<text x="76" y="255.45" font-size="24.72" font-weight="700" fill="#A8432B">✗</text>
<text x="120" y="255.45" font-size="21.63" font-weight="400" fill="#4F625F">水只能自由扩散</text>
<text x="600" y="255.45" font-size="22.66" font-weight="700" fill="#2A5F55">→</text>
<text x="646" y="255.45" font-size="21.63" font-weight="500" fill="#16282A">水还有水通道蛋白这条协助扩散的路</text>
<line x1="76" y1="294.59" x2="1204" y2="294.59" stroke="#D8D2C2" stroke-width="0.9" />
<text x="76" y="311.07" font-size="24.72" font-weight="700" fill="#A8432B">✗</text>
<text x="120" y="311.07" font-size="21.63" font-weight="400" fill="#4F625F">有载体就一定耗能</text>
<text x="600" y="311.07" font-size="22.66" font-weight="700" fill="#2A5F55">→</text>
<text x="646" y="311.07" font-size="21.63" font-weight="500" fill="#16282A">协助扩散有载体，不耗能</text>
<line x1="76" y1="350.21" x2="1204" y2="350.21" stroke="#D8D2C2" stroke-width="0.9" />
