<rect x="76" y="87" width="6" height="6" fill="#16282A" /><text x="92" y="96" font-size="12.88" font-weight="500" fill="#16282A" letter-spacing="2.27">第三支试管为什么一动不动</text>
<text x="76" y="170" font-family="Songti SC, STSong, SimSun, serif" font-size="33.99" font-weight="700" fill="#16282A" letter-spacing="0.68">九、煮沸与低温，不是同一件事</text>
<text x="76" y="253.39" font-size="13.39" font-weight="500" fill="#A8432B" letter-spacing="2.47">煮沸</text>
<text x="76" y="311.07" font-family="Songti SC, STSong, SimSun, serif" font-size="32.96" font-weight="700" fill="#16282A">结构被破坏</text>
<text x="76" y="362.57" font-size="18.54" font-weight="400" fill="#4F625F">空间结构散开，活性丧失<tspan x="76" dy="37.08">冷却后回不来</tspan><tspan x="76" dy="37.08">不可逆</tspan></text>


<text x="680" y="253.39" font-size="13.39" font-weight="500" fill="#2A5F55" letter-spacing="2.47">低温</text>
<text x="680" y="311.07" font-family="Songti SC, STSong, SimSun, serif" font-size="32.96" font-weight="700" fill="#16282A">只是冻住</text>
<text x="680" y="362.57" font-size="18.54" font-weight="400" fill="#4F625F">结构完好，速率极低<tspan x="680" dy="37.08">回暖后恢复</tspan><tspan x="680" dy="37.08">可逆</tspan></text>


