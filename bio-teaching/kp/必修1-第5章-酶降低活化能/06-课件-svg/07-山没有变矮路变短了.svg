<rect x="0" y="300" width="1280" height="420" fill="#0F1B1F" fill-opacity="0.55" />
<text x="96" y="430" font-size="18" font-weight="500" fill="#F7F3EC" letter-spacing="2" fill-opacity="0.9">把山凿低，而不是把人抬高</text>
