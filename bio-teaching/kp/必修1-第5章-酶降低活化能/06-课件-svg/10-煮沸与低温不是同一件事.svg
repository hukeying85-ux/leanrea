<svg xmlns="http://www.w3.org/2000/svg" lang="zh-CN" viewBox="0 0 1280 720" width="1280" height="720" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" data-pptx-page-role="content">
<rect x="0" y="0" width="1280" height="720" fill="#F4EFE4" id="bg" data-pptx-role="background" />
<g id="content" data-pptx-bounds="0 0 1280 720">
<rect x="76" y="87" width="7" height="7" fill="#B8452A" /><text x="92" y="96" font-size="13" font-weight="500" fill="#B8452A" letter-spacing="3.2">第三支试管为什么一动不动</text>
<text x="76" y="168" font-family="Songti SC, STSong, SimSun, serif" font-size="34" font-weight="700" fill="#14302F">煮沸与低温，不是同一件事</text>
<line x1="640.0" y1="224.08" x2="640.0" y2="486.08000000000004" stroke="#D5CCBA" stroke-width="1" />
<text x="76.0" y="250.08" font-size="13" font-weight="500" fill="#B8452A" letter-spacing="2.4">煮沸</text>
<text x="76.0" y="306.08000000000004" font-family="Songti SC, STSong, SimSun, serif" font-size="32" font-weight="700" fill="#14302F">结构被破坏</text>
<text x="76.0" y="356.08000000000004" font-size="18" font-weight="400" fill="#4E625F">空间结构散开，活性丧失</text>
<text x="76.0" y="392.08000000000004" font-size="18" font-weight="400" fill="#4E625F">冷却后回不来</text>
<text x="76.0" y="428.08000000000004" font-size="18" font-weight="400" fill="#4E625F">不可逆</text>
<text x="674.0" y="250.08" font-size="13" font-weight="500" fill="#2C6157" letter-spacing="2.4">低温</text>
<text x="674.0" y="306.08000000000004" font-family="Songti SC, STSong, SimSun, serif" font-size="32" font-weight="700" fill="#14302F">只是冻住</text>
<text x="674.0" y="356.08000000000004" font-size="18" font-weight="400" fill="#4E625F">结构完好，速率极低</text>
<text x="674.0" y="392.08000000000004" font-size="18" font-weight="400" fill="#4E625F">回暖后恢复</text>
<text x="674.0" y="428.08000000000004" font-size="18" font-weight="400" fill="#4E625F">可逆</text>
<line x1="76" y1="654" x2="1204" y2="654" stroke="#D5CCBA" stroke-width="1" /><text x="76" y="682" font-size="12" font-weight="400" fill="#4E625F" letter-spacing="1.6" fill-opacity="0.8">几微克蛋白质，凭什么让反应快几百倍</text><text x="1204" y="682" font-size="12" font-weight="400" fill="#4E625F" text-anchor="end" letter-spacing="1.2" fill-opacity="0.8">10 — 15</text>
</g>
