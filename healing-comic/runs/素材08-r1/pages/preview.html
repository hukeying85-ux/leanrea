<header><h1>引导型恋人，从不做的 8 件事</h1><p>复刻《毁掉关系的八种做法》版式 · 1080×1447</p></header>
<div class="grid"><figure><img src="素材08_01.png" alt="手机上的广告 一根线关掉"><figcaption><b>手机上的广告 一根线关掉</b><br>不 root、不刷机，只拨系统自带的开关<br></figcaption></figure><figure><img src="素材08_02.png" alt="开屏广告"><figcaption><b>开屏广告</b><br>打开 App，先看五秒广告<br>跳过键在哪， 手指都找酸了 / 它本来就不想 让你找到</figcaption></figure><figure><img src="素材08_03.png" alt="下拉热搜"><figcaption><b>下拉热搜</b><br>搜索框一拉，全是别人热搜<br>我只想搜个 天气而已 / 顺手动两下， 就能关干净</figcaption></figure><figure><img src="素材08_04.png" alt="应用商店"><figcaption><b>应用商店</b><br>商店里的轮播，比软件还显眼<br>装个软件， 还得先逛广告 / 这些推广位， 系统里能关</figcaption></figure><figure><img src="素材08_05.png" alt="营销推送"><figcaption><b>营销推送</b><br>通知栏一天响十次，全是推荐<br>手机一震， 我以为有人找我 / 留下快递和 天气就好</figcaption></figure><figure><img src="素材08_06.png" alt="快应用"><figcaption><b>快应用</b><br>点错一下，就跳出个小程序<br>手指一抖， 又跳出来一个 / 快应用也能 一次性关掉</figcaption></figure><figure><img src="素材08_07.png" alt="接上电脑"><figcaption><b>接上电脑</b><br>一根数据线，点五下就完事<br>要装一堆 东西吗 / 就一根线， 插上点几下</figcaption></figure><figure><img src="素材08_08.png" alt="不 root"><figcaption><b>不 root</b><br>不刷机，只拨自带的开关<br>会不会把手机 弄坏了 / 不动系统， 只动那几个开关</figcaption></figure><figure><img src="素材08_09.png" alt="能还原"><figcaption><b>能还原</b><br>关了什么，都能一条条退回<br>改错了 怎么办 / 改之前有备份， 一条命令还原</figcaption></figure><figure><img src="素材08_10.png" alt="手机安静了"><figcaption><b>手机安静了</b><br>广告停了，时间还给自己<br>今天没人 找我吧 / 没人找你， 挺好的</figcaption></figure></div>
