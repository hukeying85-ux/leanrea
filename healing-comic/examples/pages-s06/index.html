<div class="grid"><figure><img src="系列06_01.png" alt="引导的技术 提问·选择·留白"><figcaption><b>引导的技术 提问·选择·留白</b><br>三个动作，把选择权递回去<br></figcaption></figure><figure><img src="系列06_02.png" alt="先问再给"><figcaption><b>先问再给</b><br>没问就给，等于替TA决定<br>你说我该怎么办？ / 你想要建议， 还是想被听到？</figcaption></figure><figure><img src="系列06_03.png" alt="换成问句"><figcaption><b>换成问句</b><br>把决定权，包进问句里<br>我们必须谈谈。 / 这周哪天， 你想聊聊？</figcaption></figure><figure><img src="系列06_04.png" alt="二选一"><figcaption><b>二选一</b><br>选不出来时，给两个选项<br>随便，都行…… / 周日还是周三？ 你选一个。</figcaption></figure><figure><img src="系列06_05.png" alt="你说了算"><figcaption><b>你说了算</b><br>做到了，也不邀功<br>还不是你安排得好。 / 是你， 你自己做到的。</figcaption></figure><figure><img src="系列06_06.png" alt="留白"><figcaption><b>留白</b><br>问完之后，忍住不说<br>让我想想…… / 嗯，不急。</figcaption></figure><figure><img src="系列06_07.png" alt="不找话"><figcaption><b>不找话</b><br>安静，也是一种陪<br>你怎么不说话？ / 不用一直说， 我在呢。</figcaption></figure><figure><img src="系列06_08.png" alt="不问为什么"><figcaption><b>不问为什么</b><br>「怎么了」，不是「为什么」<br>我搞砸了…… / 怎么了？ 慢慢说。</figcaption></figure><figure><img src="系列06_09.png" alt="问·选·等"><figcaption><b>问·选·等</b><br>三个动作，一个原则<br>到底怎么引导？ / 多问，给选项， 多点耐心。</figcaption></figure><figure><img src="系列06_10.png" alt="技巧背后"><figcaption><b>技巧背后</b><br>技巧之上，是尊重<br>这些技巧，够了吗？ / 技巧之上， 是尊重。</figcaption></figure></div>
