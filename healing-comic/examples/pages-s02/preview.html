<div class="grid"><figure><img src="系列02_01.png" alt="引导型恋人 第二课·先稳自己"><figcaption><b>引导型恋人 第二课·先稳自己</b><br>稳得住，也不控制人<br></figcaption></figure><figure><img src="系列02_02.png" alt="先站对位置"><figcaption><b>先站对位置</b><br>站错位置，引导变说教<br>你又想说服我？ / 不是说服， 是商量。</figcaption></figure><figure><img src="系列02_03.png" alt="引导是点灯"><figcaption><b>引导是点灯</b><br>点灯，不是抓方向盘<br>你替我选吧。 / 我点灯， 路你自己走。</figcaption></figure><figure><img src="系列02_04.png" alt="沉默分两种"><figcaption><b>沉默分两种</b><br>过载了，先降门槛<br>别问了， 说不出…… / 不问。你先写 三个词给我。</figcaption></figure><figure><img src="系列02_05.png" alt="亮出边界"><figcaption><b>亮出边界</b><br>温和，也亮边界<br>哼，不想理你。 / 我可以等。 但沉默罚人，我不接。</figcaption></figure><figure><img src="系列02_06.png" alt="后退不是不爱"><figcaption><b>后退不是不爱</b><br>躲一下，不是冷暴力<br>对不起，我又 缩起来了…… / 不用道歉， 缩一会儿没关系。</figcaption></figure><figure><img src="系列02_07.png" alt="看懂TA的独立"><figcaption><b>看懂TA的独立</b><br>独立，不是拒绝<br>我自己来就行。 / 我知道。什么时候 愿意让我参与？</figcaption></figure><figure><img src="系列02_08.png" alt="一个字的差别"><figcaption><b>一个字的差别</b><br>帮你做，不如陪你做<br>……这个好难。 / 要不要我陪你做？</figcaption></figure><figure><img src="系列02_10.png" alt="两个人的位置"><figcaption><b>两个人的位置</b><br>靠得近，也有退路<br>一直黏着，好不好？ / 好。也要有 自己的小角落。</figcaption></figure></div>
