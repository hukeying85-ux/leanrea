name: probe-youtube
on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/probe-yt.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VID: bkGhmZLOAwI
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: "${{ github.ref }}"}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq curl jq
          python -m pip install -q -U curl_cffi pillow
          mkdir -p /tmp/p
      - name: write script
        run: |
          cat > /tmp/probe.py <<'PYEOF'
          import os, re, json, subprocess
          VID=os.environ["VID"]; OUT="/tmp/p"
          def sh(c,t=90):
              r=subprocess.run(c,capture_output=True,text=True,timeout=t); return r.stdout.strip()
          from curl_cffi import requests as creq
          r=creq.get(f"https://www.youtube.com/shorts/{VID}", impersonate="chrome131", timeout=60,
                     headers={"Accept-Language":"zh-CN,zh;q=0.9"})
          print("page", r.status_code, len(r.text))
          m=re.search(r'ytInitialPlayerResponse\s*=\s*(\{.+?\})\s*;\s*(?:var|const|</script>)', r.text, re.S)
          t=m.group(1); d=0; end=0
          for i,ch in enumerate(t):
              if ch=='{': d+=1
              elif ch=='}':
                  d-=1
                  if d==0: end=i+1; break
          pr=json.loads(t[:end])
          spec=pr["storyboards"]["playerStoryboardSpecRenderer"]["spec"]
          parts=spec.split("|"); base=parts[0]
          print("BASE:", base)
          levels=[]
          for i,s in enumerate(parts[1:]):
              f=s.split("#")
              if len(f)<8: continue
              levels.append(dict(i=i,name=f[6],sigh=f[7],w=int(f[0]),h=int(f[1]),
                                 n=int(f[2]),cols=int(f[3]),rows=int(f[4])))
          for l in levels:
              l["sig"]=l["sigh"].replace("$A","")
              print("LVL",l["i"],"name=",l["name"],"sigh=",l["sigh"],"-> sig=",l["sig"])

          def build(l, n):
              u=base.replace("$L",str(l["i"])).replace("$N",l["name"].replace("$M",str(n)))
              return u+"&sigh="+l["sig"]

          print("\n=== 变体测试（level 3, sheet 0）===")
          L=levels[3]
          tests={
            "S1_sigh_stripped": build(L,0),
            "S2_sigh_raw":      build(L,0).rsplit("sigh=",1)[0]+"sigh="+L["sigh"],
            "S3_no_sigh":       build(L,0).rsplit("&sigh=",1)[0],
            "S4_pure":          base.replace("$L",str(L["i"])).replace("$N",L["name"].replace("$M","0")),
            "S5_L$L_unreplaced": base.replace("$N",L["name"].replace("$M","0")),
          }
          for k,u in tests.items():
              dst=f"/tmp/p/{k}.jpg"
              out=sh(["curl","-sL","--max-time","30","-w","%{http_code} %{size_download}","-o",dst,u])
              sz=os.path.getsize(dst) if os.path.exists(dst) else 0
              head=open(dst,"rb").read(3) if sz else b""
              kind="JPEG" if head[:2]==b"\xff\xd8" else ("PNG" if head[:4]==b"\x89PNG"[:3] else "OTHER")
              print(f"{k:20s} {out:14s} {kind:6s} {u[:120]}")
          print("\n=== 四级全测（sheet0）===")
          for l in levels:
              u=build(l,0); dst=f"/tmp/p/lvl{l['i']}.jpg"
              out=sh(["curl","-sL","--max-time","30","-w","%{http_code} %{size_download}","-o",dst,u])
              print(f"lvl{l['i']} {l['w']}x{l['h']} {out:14s} {u[:110]}")
          PYEOF
          python3 -c "import ast;ast.parse(open('/tmp/probe.py').read());print('py OK')"
      - name: run
        run: python3 /tmp/probe.py 2>&1 | tee /tmp/probe.log
      - name: save
        if: always()
        run: |
          D="media-raw/03_YouTube素材/$VID"; mkdir -p "$D"
          cp /tmp/probe.log "$D/probe.log" 2>/dev/null || true
          rm -rf /tmp/mo
          if ! git clone --quiet --branch media-out "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" /tmp/mo; then
            mkdir -p /tmp/mo && cd /tmp/mo && git init -q && git checkout -q -b media-out
          fi
          cd /tmp/mo && git config user.name relay && git config user.email relay@x
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          mkdir -p "$D"; cp /tmp/probe.log "$D/" 2>/dev/null || true
          git add -A && { git diff --cached --quiet || git commit -q -m "probe sb $(date -u +%FT%TZ)"; }
          git push origin media-out || true
