name: probe-youtube
on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/probe-yt.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env: {VID: bkGhmZLOAwI}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: "${{ github.ref }}"}
      - name: grab all i.ytimg frames
        run: |
          mkdir -p /tmp/g
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36"
          : > /tmp/g/try.log
          for n in maxresdefault maxres1 maxres2 maxres3 sddefault sd1 sd2 sd3 \
                   hqdefault hq1 hq2 hq3 mqdefault mq1 mq2 mq3 default 0 1 2 3; do
            code=$(curl -sL --max-time 30 -A "$UA" -w "%{http_code} %{size_download}" \
                   -o "/tmp/g/$n.jpg" "https://i.ytimg.com/vi/$VID/$n.jpg")
            sz=$(stat -c%s "/tmp/g/$n.jpg" 2>/dev/null || echo 0)
            if [ "$sz" -gt 5000 ] && [ "$(head -c2 /tmp/g/$n.jpg | od -An -tx1 | tr -d ' \n')" = "ffd8" ]; then
              echo "OK   $n -> $code" | tee -a /tmp/g/try.log
            else
              rm -f "/tmp/g/$n.jpg"; echo "MISS $n -> $code" | tee -a /tmp/g/try.log
            fi
          done
          ls -la /tmp/g
      - name: save
        if: always()
        run: |
          D="media-raw/03_YouTube素材/$VID"; mkdir -p "$D"
          cp /tmp/g/*.jpg "$D"/ 2>/dev/null || true
          cp /tmp/g/try.log "$D"/ 2>/dev/null || true
          rm -rf /tmp/mo
          if ! git clone --quiet --branch media-out "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" /tmp/mo; then
            mkdir -p /tmp/mo && cd /tmp/mo && git init -q && git checkout -q -b media-out
          fi
          cd /tmp/mo && git config user.name relay && git config user.email r@x
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          mkdir -p "$D"; cp /tmp/g/*.jpg "$D"/ 2>/dev/null || true; cp /tmp/g/try.log "$D"/ 2>/dev/null || true
          git add -A && { git diff --cached --quiet || git commit -q -m "frames: ytimg all $(date -u +%FT%TZ)"; }
          git push origin media-out || true
