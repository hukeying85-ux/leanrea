name: fetch-bilibili

# 为什么需要这个 workflow：Agent 沙箱的出网白名单只有 github / npm / pypi，
# *.bilibili.com、*.hdslb.com、*.bilivideo.com 在 IP 层就被拦（TLS EOF），
# yt-dlp / yutto / bilix / you-get / BBDown 全都在第一步取 playurl 时挂掉。
# GitHub 的 runner 有完整外网，于是把「下载」这一步外包给 runner，
# 下完切成 ≤20MB 的块推回本分支，Agent 侧再用 codeload 拉 tar.gz 取回、
# 本地按顺序拼回 mp4（codeload.github.com 在白名单里）。
#
# 触发条件故意只挂 workflow 文件本身的改动，避免提交分块时套娃触发。

on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/fetch-bv.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BV: BV1suxg6MEJz
      URL: https://www.bilibili.com/video/BV1suxg6MEJz/
      CHUNK: 20m
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: 环境
        run: |
          python3 -V
          ffmpeg -version | head -1
          pip install -q -U yt-dlp yutto bilix you-get
          yt-dlp --version

      - name: 逐个下载器试（前面的失败就走下一个）
        id: dl
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/out downloads/$BV
          LOG=downloads/$BV/attempt.log
          : > "$LOG"
          try () {
            local name="$1"; shift
            echo "=================== $name ===================" | tee -a "$LOG"
            timeout 900 "$@" >>"$LOG" 2>&1
            local rc=$?
            echo "[$name] exit=$rc" | tee -a "$LOG"
            return $rc
          }
          ok=1
          try yt-dlp yt-dlp -f "bv*+ba/b" --merge-output-format mp4 --write-info-json \
              -o "/tmp/out/%(title).80s.%(ext)s" "$URL" && ok=0
          if [ $ok -ne 0 ]; then
            try yt-dlp-hls yt-dlp -f "b" --merge-output-format mp4 \
                -o "/tmp/out/%(title).80s.%(ext)s" "$URL" && ok=0
          fi
          if [ $ok -ne 0 ]; then
            try yutto yutto -v "$URL" -d /tmp/out --no-danmaku && ok=0
          fi
          if [ $ok -ne 0 ]; then
            try bilix bilix get_video "$URL" -d /tmp/out --no-danmaku && ok=0
          fi
          echo "OK=$ok" | tee -a "$LOG"
          ls -la /tmp/out | tee -a "$LOG"
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: 报告 + 切块
        shell: bash
        run: |
          set -e
          D=downloads/$BV
          mkdir -p "$D"
          V=$(find /tmp/out -maxdepth 1 -type f \( -name '*.mp4' -o -name '*.mkv' -o -name '*.flv' \) -size +1M | head -1)
          INFO=$(find /tmp/out -maxdepth 1 -name '*.info.json' | head -1)
          {
            echo "bvid: $BV"
            echo "url: $URL"
            echo "runner_utc: $(date -u +%FT%TZ)"
            echo "yt_dlp: $(yt-dlp --version 2>/dev/null)"
            echo "ffmpeg: $(ffmpeg -version | head -1)"
            echo "ok: ${{ steps.dl.outputs.ok }}"
            if [ -n "$V" ]; then
              echo "video_file: $(basename "$V")"
              echo "video_bytes: $(stat -c%s "$V")"
              echo "sha256: $(sha256sum "$V" | cut -d' ' -f1)"
              ffprobe -v error -show_entries format=duration,size,bit_rate:stream=codec_name,width,height,r_frame_rate,codec_type \
                -of default=noprint_wrappers=1 "$V"
            else
              echo "video_file: NONE"
              echo "--- attempt.log tail ---"
              tail -40 "$D/attempt.log" 2>/dev/null || true
            fi
          } | tee "$D/result.txt"
          [ -n "$INFO" ] && cp "$INFO" "$D/info.json" || true
          if [ -n "$V" ]; then
            split -b "$CHUNK" -d -a 3 "$V" "$D/part-"
            ( cd "$D" && sha256sum part-* > parts.sha256 && ls -l part-* > parts.list )
          fi
          du -sh "$D"

      - name: 推回分支
        shell: bash
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A downloads
          git commit -m "chore(downloads): runner 抓取 $BV 源视频分块" || echo "nothing to commit"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done
          git log --oneline -3
