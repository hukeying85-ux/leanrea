name: Fetch and validate sunset note images

on:
  push:
    branches:
      - arena/521d9762-leanrea
    paths:
      - .github/workflows/fetch-xhs-sunset.yml
      - healing-comic/scripts/download_xhs_note.py

permissions:
  contents: write

concurrency:
  group: xhs-sunset-arena-521d9762
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/521d9762-leanrea
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image validation dependencies
        run: python -m pip install 'Pillow==11.3.0' 'requests==2.32.4'
      - name: Download and validate all images
        run: python healing-comic/scripts/download_xhs_note.py
      - name: Commit validated images to the same branch
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add healing-comic/deliverables/xhs-sunset/originals/
          git diff --cached --quiet && exit 1
          git commit -m 'Archive validated sunset note images'
          git push origin HEAD:refs/heads/arena/521d9762-leanrea
