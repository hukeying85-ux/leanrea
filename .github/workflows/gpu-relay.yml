name: gpu-relay

# Privacy-Locked Cloud GPU + Kaggle AI ($10/day) Control Plane
# - Credentials & private media travel ONLY via one-time RSA-4096+AES-256 envelopes (*.enc) and Actions cache (~/.gpu-relay).
# - Also mints short-lived Kaggle Benchmarks Model Proxy credentials ($10/day AI quota) in-memory.
# - Run logs, metrics, and rendered bundles stream directly to private Google Drive via one-time resumable URIs.
# - NEVER commits personal media, run outputs, logs, or account identifiers to Git.

on:
  push:
    paths:
      - 'cloud-gpu/jobs/queue.json'
      - 'cloud-gpu/secrets/*.enc'
      - '.github/workflows/gpu-relay.yml'
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      only_id:
        description: 'Run only specified job id'
        required: false
        default: ''
      force:
        description: 'Force re-run completed jobs'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gpu-relay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Kaggle CLI
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "kaggle>=2.2" six python-dotenv

      - name: Restore persistent auth vault
        uses: actions/cache/restore@v4
        with:
          path: ~/.gpu-relay
          key: gpu-relay-vault-${{ github.run_id }}
          restore-keys: |
            gpu-relay-vault-

      - name: Prepare RSA keypair, decrypt envelopes & mint Kaggle AI Proxy token
        id: vault
        env:
          SECRET_KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          SECRET_KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          SECRET_KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.gpu-relay
          chmod 700 ~/.gpu-relay

          hash_vault() {
            find ~/.gpu-relay -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum 2>/dev/null | sha256sum | awk '{print $1}'
          }
          PRE_HASH="$(hash_vault)"

          if [ ! -f ~/.gpu-relay/key.pem ]; then
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out ~/.gpu-relay/key.pem 2>/dev/null
            chmod 600 ~/.gpu-relay/key.pem
          fi
          openssl pkey -in ~/.gpu-relay/key.pem -pubout -out cloud-gpu/relay_pubkey.pem

          if [ -n "$SECRET_KAGGLE_API_TOKEN" ]; then
            printf '%s\n' "$SECRET_KAGGLE_API_TOKEN" > ~/.gpu-relay/kaggle_token
            chmod 600 ~/.gpu-relay/kaggle_token
          elif [ -n "$SECRET_KAGGLE_USERNAME" ] && [ -n "$SECRET_KAGGLE_KEY" ]; then
            printf '%s:%s\n' "$SECRET_KAGGLE_USERNAME" "$SECRET_KAGGLE_KEY" > ~/.gpu-relay/kaggle_token
            chmod 600 ~/.gpu-relay/kaggle_token
          fi

          shopt -s nullglob
          for enc_file in cloud-gpu/secrets/*.enc; do
            name="$(basename "$enc_file" .enc)"
            tmp_plain="$(mktemp)"
            chmod 600 "$tmp_plain"
            if python cloud-gpu/scripts/encrypt_secret.py decrypt --privkey ~/.gpu-relay/key.pem --in "$enc_file" --out "$tmp_plain" >/dev/null; then
              case "$name" in
                KAGGLE_API_TOKEN)
                  val="$(cat "$tmp_plain")"
                  [ -n "$val" ] && echo "::add-mask::$val"
                  cp "$tmp_plain" ~/.gpu-relay/kaggle_token
                  chmod 600 ~/.gpu-relay/kaggle_token
                  ;;
                PRIVATE_INPUTS_TAR_GZ)
                  mkdir -p /tmp/private-inputs
                  chmod 700 /tmp/private-inputs
                  tar -xzf "$tmp_plain" -C /tmp/private-inputs
                  echo "PRIVATE_INPUTS_DIR=/tmp/private-inputs" >> "$GITHUB_ENV"
                  ;;
                *)
                  val="$(cat "$tmp_plain")"
                  [ -n "$val" ] && echo "::add-mask::$val"
                  echo "$name=$val" >> "$GITHUB_ENV"
                  ;;
              esac
              git rm -f --ignore-unmatch "$enc_file" >/dev/null 2>&1 || rm -f "$enc_file"
            fi
            rm -f "$tmp_plain"
          done

          # Mint short-lived Kaggle Benchmarks Model Proxy credentials ($10/day AI quota, 0 GPU sec)
          if [ -f ~/.gpu-relay/kaggle_token ]; then
            KAGGLE_API_TOKEN="$(cat ~/.gpu-relay/kaggle_token)" kaggle benchmarks auth -y --env-file /tmp/kbench.env >/dev/null 2>&1 || true
            if [ -f /tmp/kbench.env ]; then
              python - <<'PY'
          import os, dotenv
          vals = dotenv.dotenv_values("/tmp/kbench.env")
          ak = (vals.get("MODEL_PROXY_API_KEY") or "").strip()
          if ak:
              print(f"::add-mask::{ak}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as gf:
              for k in ("MODEL_PROXY_URL", "MODEL_PROXY_API_KEY", "LLMS_AVAILABLE", "LLM_DEFAULT", "LLM_DEFAULT_EVAL"):
                  v = (vals.get(k) or "").strip()
                  if v:
                      gf.write(f"{k}={v}\n")
          PY
              rm -f /tmp/kbench.env
            fi
          fi

          POST_HASH="$(hash_vault)"
          if [ "$PRE_HASH" != "$POST_HASH" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Persist updated auth vault in Actions cache
        if: always() && steps.vault.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.gpu-relay
          key: gpu-relay-vault-${{ github.run_id }}

      - name: Execute GPU job queue (private run dir outside git)
        id: run_jobs
        continue-on-error: true
        run: |
          mkdir -p /tmp/private-gpu-runs
          cp cloud-gpu/jobs/queue.json /tmp/private-gpu-runs/queue.json
          ARGS=(run-queue --queue /tmp/private-gpu-runs/queue.json --runs-dir /tmp/private-gpu-runs)
          if [ -n "${{ inputs.only_id }}" ]; then
            ARGS+=(--only-id "${{ inputs.only_id }}")
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS+=(--force)
          fi
          python cloud-gpu/scripts/gpu_ctl.py "${ARGS[@]}" >/tmp/private-gpu-runs/dispatch.log 2>&1

      - name: Stream execution report to private Google Drive
        if: always() && env.DRIVE_RESULT_UPLOAD_URI != ''
        run: |
          set -euo pipefail
          tmp_rep="$(mktemp)"
          chmod 600 "$tmp_rep"
          python - "$tmp_rep" <<'PY'
          import datetime, glob, json, os, sys

          runs_root = "/tmp/private-gpu-runs"
          bundle = {
              "timestamp_utc": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "model_proxy_ready": bool(os.environ.get("MODEL_PROXY_URL") and os.environ.get("MODEL_PROXY_API_KEY")),
              "llms_available": os.environ.get("LLMS_AVAILABLE", ""),
              "queue_final": json.load(open(os.path.join(runs_root, "queue.json"), "r", encoding="utf-8")) if os.path.exists(os.path.join(runs_root, "queue.json")) else None,
              "dispatch_log": open(os.path.join(runs_root, "dispatch.log"), "r", encoding="utf-8", errors="replace").read()[-16000:] if os.path.exists(os.path.join(runs_root, "dispatch.log")) else "",
              "jobs": {},
          }

          for entry in sorted(glob.glob(os.path.join(runs_root, "*"))):
              if not os.path.isdir(entry):
                  continue
              jid = os.path.basename(entry)
              jdata = {}
              for fname in sorted(os.listdir(entry)):
                  fpath = os.path.join(entry, fname)
                  if not os.path.isfile(fpath):
                      continue
                  if fname.endswith(".json"):
                      try:
                          jdata[fname] = json.load(open(fpath, "r", encoding="utf-8"))
                      except Exception:
                          jdata[fname] = open(fpath, "r", encoding="utf-8", errors="replace").read()[-12000:]
                  else:
                      jdata[fname] = open(fpath, "r", encoding="utf-8", errors="replace").read()[-12000:]
              bundle["jobs"][jid] = jdata

          with open(sys.argv[1], "w", encoding="utf-8") as f:
              json.dump(bundle, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
          python cloud-gpu/scripts/drive_put.py --uri-env DRIVE_RESULT_UPLOAD_URI --file "$tmp_rep" --mime application/json >/dev/null
          rm -f "$tmp_rep"

      - name: Clean consumed encrypted envelopes & publish relay pubkey
        if: always()
        run: |
          rm -rf /tmp/private-inputs /tmp/private-gpu-runs
          git config user.name  "gpu-relay[bot]"
          git config user.email "gpu-relay[bot]@users.noreply.github.com"
          [ -f cloud-gpu/relay_pubkey.pem ] && git add cloud-gpu/relay_pubkey.pem
          git add -u cloud-gpu/secrets 2>/dev/null || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "gpu-relay: sync pubkey & consume envelopes [skip ci]"
          for i in 1 2 3; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || { git rebase --abort; exit 1; }
          done
          exit 1

      - name: Propagate job exit status
        if: steps.run_jobs.outcome == 'failure'
        run: exit 1
