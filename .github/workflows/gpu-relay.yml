name: gpu-relay

# Privacy-Locked Cloud GPU Control Plane (Google Drive Private Vault Only)
# - Credentials live in user's private Google Drive (vault.json) + Actions encrypted cache (~/.gpu-relay).
# - All run logs, metrics, endpoints, and updated credentials stream directly to private Google Drive
#   via one-time pre-authorized resumable upload URIs.
# - NEVER commits run outputs, logs, or account identifiers to the Git repository.

on:
  push:
    paths:
      - 'cloud-gpu/jobs/queue.json'
      - 'cloud-gpu/secrets/*.enc'
      - '.github/workflows/gpu-relay.yml'
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      only_id:
        description: 'Run only specified job id'
        required: false
        default: ''
      force:
        description: 'Force re-run completed jobs'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gpu-relay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Colab & Kaggle CLIs
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet google-colab-cli kaggle six

      - name: Restore persistent auth vault
        uses: actions/cache/restore@v4
        with:
          path: ~/.gpu-relay
          key: gpu-relay-vault-${{ github.run_id }}
          restore-keys: |
            gpu-relay-vault-

      - name: Prepare RSA keypair & decrypt envelopes
        id: vault
        env:
          SECRET_COLAB_ADC_JSON: ${{ secrets.COLAB_ADC_JSON }}
          SECRET_KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          SECRET_KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          SECRET_KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.gpu-relay
          chmod 700 ~/.gpu-relay

          hash_vault() {
            find ~/.gpu-relay -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum 2>/dev/null | sha256sum | awk '{print $1}'
          }
          PRE_HASH="$(hash_vault)"

          if [ ! -f ~/.gpu-relay/key.pem ]; then
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out ~/.gpu-relay/key.pem 2>/dev/null
            chmod 600 ~/.gpu-relay/key.pem
          fi
          openssl pkey -in ~/.gpu-relay/key.pem -pubout -out cloud-gpu/relay_pubkey.pem

          if [ -n "$SECRET_COLAB_ADC_JSON" ]; then
            printf '%s\n' "$SECRET_COLAB_ADC_JSON" > ~/.gpu-relay/colab_adc.json
            chmod 600 ~/.gpu-relay/colab_adc.json
          fi
          if [ -n "$SECRET_KAGGLE_API_TOKEN" ]; then
            printf '%s\n' "$SECRET_KAGGLE_API_TOKEN" > ~/.gpu-relay/kaggle_token
            chmod 600 ~/.gpu-relay/kaggle_token
          elif [ -n "$SECRET_KAGGLE_USERNAME" ] && [ -n "$SECRET_KAGGLE_KEY" ]; then
            printf '%s:%s\n' "$SECRET_KAGGLE_USERNAME" "$SECRET_KAGGLE_KEY" > ~/.gpu-relay/kaggle_token
            chmod 600 ~/.gpu-relay/kaggle_token
          fi

          # 1) Unpack PKCE verifier first if present
          if [ -f cloud-gpu/secrets/COLAB_PKCE_PENDING.enc ]; then
            if python cloud-gpu/scripts/encrypt_secret.py decrypt --privkey ~/.gpu-relay/key.pem \
                 --in cloud-gpu/secrets/COLAB_PKCE_PENDING.enc --out ~/.gpu-relay/pkce_pending.json >/dev/null; then
              chmod 600 ~/.gpu-relay/pkce_pending.json
              git rm -f --ignore-unmatch cloud-gpu/secrets/COLAB_PKCE_PENDING.enc >/dev/null 2>&1 || rm -f cloud-gpu/secrets/COLAB_PKCE_PENDING.enc
            fi
          fi

          # 2) Unpack cross-conversation VAULT_JSON.enc if provided from Google Drive
          if [ -f cloud-gpu/secrets/VAULT_JSON.enc ]; then
            tmp_vault="$(mktemp)"
            chmod 600 "$tmp_vault"
            if python cloud-gpu/scripts/encrypt_secret.py decrypt --privkey ~/.gpu-relay/key.pem \
                 --in cloud-gpu/secrets/VAULT_JSON.enc --out "$tmp_vault" >/dev/null; then
              python - "$tmp_vault" <<'PY'
          import json, os, sys
          data = json.load(open(sys.argv[1], "r", encoding="utf-8"))
          base = os.path.expanduser("~/.gpu-relay")
          if data.get("colab_adc"):
              p = os.path.join(base, "colab_adc.json")
              with open(p, "w", encoding="utf-8") as f:
                  json.dump(data["colab_adc"], f, indent=2)
              os.chmod(p, 0o600)
          if data.get("kaggle_api_token"):
              p = os.path.join(base, "kaggle_token")
              with open(p, "w", encoding="utf-8") as f:
                  f.write(str(data["kaggle_api_token"]).strip() + "\n")
              os.chmod(p, 0o600)
          PY
              git rm -f --ignore-unmatch cloud-gpu/secrets/VAULT_JSON.enc >/dev/null 2>&1 || rm -f cloud-gpu/secrets/VAULT_JSON.enc
            fi
            rm -f "$tmp_vault"
          fi

          # 3) Unpack remaining one-time envelopes
          shopt -s nullglob
          for enc_file in cloud-gpu/secrets/*.enc; do
            name="$(basename "$enc_file" .enc)"
            tmp_plain="$(mktemp)"
            chmod 600 "$tmp_plain"
            if python cloud-gpu/scripts/encrypt_secret.py decrypt --privkey ~/.gpu-relay/key.pem --in "$enc_file" --out "$tmp_plain" >/dev/null; then
              val="$(cat "$tmp_plain")"
              if [ -n "$val" ]; then
                echo "::add-mask::$val"
              fi
              case "$name" in
                COLAB_OAUTH_CODE)
                  export _TMP_OAUTH_CODE="$val"
                  python cloud-gpu/scripts/colab_auth_bootstrap.py \
                    --exchange-env _TMP_OAUTH_CODE \
                    --pkce-file ~/.gpu-relay/pkce_pending.json \
                    --out ~/.gpu-relay/colab_adc.json >/dev/null
                  unset _TMP_OAUTH_CODE
                  ;;
                COLAB_ADC_JSON)
                  cp "$tmp_plain" ~/.gpu-relay/colab_adc.json
                  chmod 600 ~/.gpu-relay/colab_adc.json
                  ;;
                KAGGLE_API_TOKEN)
                  cp "$tmp_plain" ~/.gpu-relay/kaggle_token
                  chmod 600 ~/.gpu-relay/kaggle_token
                  ;;
                *)
                  echo "$name=$val" >> "$GITHUB_ENV"
                  ;;
              esac
              git rm -f --ignore-unmatch "$enc_file" >/dev/null 2>&1 || rm -f "$enc_file"
            fi
            rm -f "$tmp_plain"
          done

          POST_HASH="$(hash_vault)"
          if [ "$PRE_HASH" != "$POST_HASH" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stream persistent credential vault to private Google Drive
        if: env.DRIVE_VAULT_UPLOAD_URI != ''
        run: |
          set -euo pipefail
          tmp_bundle="$(mktemp)"
          chmod 600 "$tmp_bundle"
          python - "$tmp_bundle" <<'PY'
          import datetime, json, os, subprocess, sys

          base = os.path.expanduser("~/.gpu-relay")
          colab_path = os.path.join(base, "colab_adc.json")
          kaggle_path = os.path.join(base, "kaggle_token")

          vault = {
              "schema_version": "1.0",
              "saved_at_utc": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "usage_note": "Private persistent credential vault for Arena AI Agent skills. Read via Google Drive connector and encrypt as VAULT_JSON.enc — NEVER commit plaintext to any repo.",
              "colab_adc": json.load(open(colab_path, "r", encoding="utf-8")) if os.path.exists(colab_path) else None,
              "kaggle_api_token": open(kaggle_path, "r", encoding="utf-8").read().strip() if os.path.exists(kaggle_path) else None,
              "verification": {},
          }

          if os.path.exists(colab_path):
              ver = subprocess.run(
                  [sys.executable, "cloud-gpu/scripts/colab_auth_bootstrap.py", "--verify", colab_path],
                  capture_output=True, text=True, check=False, timeout=30
              )
              if ver.returncode == 0 and ver.stdout.strip().startswith("{"):
                  vault["verification"]["colab"] = json.loads(ver.stdout)

          with open(sys.argv[1], "w", encoding="utf-8") as f:
              json.dump(vault, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
          python cloud-gpu/scripts/drive_put.py --uri-env DRIVE_VAULT_UPLOAD_URI --file "$tmp_bundle" --mime application/json >/dev/null
          rm -f "$tmp_bundle"
          echo "Vault synced to private Google Drive."

      - name: Persist updated auth vault in Actions cache
        if: steps.vault.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.gpu-relay
          key: gpu-relay-vault-${{ github.run_id }}

      - name: Execute GPU job queue (private run dir outside git)
        id: run_jobs
        continue-on-error: true
        run: |
          mkdir -p /tmp/private-gpu-runs
          cp cloud-gpu/jobs/queue.json /tmp/private-gpu-runs/queue.json
          ARGS=(run-queue --queue /tmp/private-gpu-runs/queue.json --runs-dir /tmp/private-gpu-runs)
          if [ -n "${{ inputs.only_id }}" ]; then
            ARGS+=(--only-id "${{ inputs.only_id }}")
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS+=(--force)
          fi
          python cloud-gpu/scripts/gpu_ctl.py "${ARGS[@]}" >/tmp/private-gpu-runs/dispatch.log 2>&1

      - name: Stream execution report to private Google Drive
        if: always() && env.DRIVE_RESULT_UPLOAD_URI != ''
        run: |
          set -euo pipefail
          tmp_rep="$(mktemp)"
          chmod 600 "$tmp_rep"
          python - "$tmp_rep" <<'PY'
          import datetime, glob, json, os, subprocess, sys

          runs_root = "/tmp/private-gpu-runs"
          colab_adc = os.path.expanduser("~/.gpu-relay/colab_adc.json")
          env = os.environ.copy()
          if os.path.exists(colab_adc):
              env["GOOGLE_APPLICATION_CREDENTIALS"] = colab_adc

          usage_out = ""
          sess_out = ""
          if os.path.exists(colab_adc):
              u = subprocess.run(["colab", "--auth=adc", "usage"], env=env, capture_output=True, text=True, check=False, timeout=30)
              usage_out = (u.stdout or u.stderr or "").strip()
              s = subprocess.run(["colab", "--auth=adc", "sessions"], env=env, capture_output=True, text=True, check=False, timeout=30)
              sess_out = (s.stdout or s.stderr or "").strip()

          bundle = {
              "timestamp_utc": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "colab_usage": usage_out,
              "colab_active_sessions_after_cleanup": sess_out,
              "queue_final": json.load(open(os.path.join(runs_root, "queue.json"), "r", encoding="utf-8")) if os.path.exists(os.path.join(runs_root, "queue.json")) else None,
              "dispatch_log": open(os.path.join(runs_root, "dispatch.log"), "r", encoding="utf-8", errors="replace").read()[-12000:] if os.path.exists(os.path.join(runs_root, "dispatch.log")) else "",
              "jobs": {},
          }

          for entry in sorted(glob.glob(os.path.join(runs_root, "*"))):
              if not os.path.isdir(entry):
                  continue
              jid = os.path.basename(entry)
              jdata = {}
              for fname in os.listdir(entry):
                  fpath = os.path.join(entry, fname)
                  if not os.path.isfile(fpath):
                      continue
                  if fname.endswith(".json"):
                      try:
                          jdata[fname] = json.load(open(fpath, "r", encoding="utf-8"))
                      except Exception:
                          jdata[fname] = open(fpath, "r", encoding="utf-8", errors="replace").read()[-8000:]
                  else:
                      jdata[fname] = open(fpath, "r", encoding="utf-8", errors="replace").read()[-8000:]
              bundle["jobs"][jid] = jdata

          with open(sys.argv[1], "w", encoding="utf-8") as f:
              json.dump(bundle, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
          python cloud-gpu/scripts/drive_put.py --uri-env DRIVE_RESULT_UPLOAD_URI --file "$tmp_rep" --mime application/json >/dev/null
          rm -f "$tmp_rep"
          echo "Execution report synced to private Google Drive."

      - name: Clean consumed encrypted envelopes on branch
        if: always()
        run: |
          git config user.name  "gpu-relay[bot]"
          git config user.email "gpu-relay[bot]@users.noreply.github.com"
          [ -f cloud-gpu/relay_pubkey.pem ] && git add cloud-gpu/relay_pubkey.pem
          git add -u cloud-gpu/secrets 2>/dev/null || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "gpu-relay: consume one-time envelopes"
          for i in 1 2 3; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || { git rebase --abort; exit 1; }
          done
          exit 1

      - name: Propagate job exit status
        if: steps.run_jobs.outcome == 'failure'
        run: exit 1
