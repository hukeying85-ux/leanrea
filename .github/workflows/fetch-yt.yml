name: fetch-youtube

# 沙箱出网白名单仅 GitHub/npm/PyPI，youtube.com 在 TLS 层被 RST。
# 本 workflow 把「下载」搬到 runner（runner 出网不受限），下完切块推回 media-out 分支，
# Agent 侧再用 codeload 拉回拼装。
#
# 为什么普通 yt-dlp 在 runner 上会 403：YouTube 对数据中心 IP 要求 PO Token。
# 这里安装 bgutil PO token provider（Node/Deno 脚本模式 + HTTP 服务模式双保险），
# 再叠加多 client 轮换 / Invidious / Piped / cobalt 多级降级。

on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/fetch-yt.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VID: bkGhmZLOAwI
      URL: https://www.youtube.com/shorts/bkGhmZLOAwI
      LOGDIR: logs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: 环境准备
        run: |
          set -x
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl jq
          # Node 20（bgutil 的 PO token 生成脚本需要 Node 或 Deno）
          curl -fsSL https://deb.nodesource.com/setup_20.x -o /tmp/nodesetup.sh && sudo -E bash /tmp/nodesetup.sh >/dev/null
          sudo apt-get install -y -qq nodejs
          node -v; npm -v
          python -m pip install -q -U pip
          python -m pip install -q -U yt-dlp yt-dlp-nightly bgutil-ytdlp-pot-provider requests gallery-dl || \
            python -m pip install -q -U yt-dlp bgutil-ytdlp-pot-provider requests
          yt-dlp --version || true
          yt-dlp-nightly --version || true
          python -c "import bgutil_ytdlp_pot_provider, sys; print('bgutil OK', bgutil_ytdlp_pot_provider.__file__)" || echo "bgutil import failed"
          mkdir -p "$LOGDIR"

      - name: 启动 bgutil PO token HTTP 服务
        run: |
          set +e
          git clone --depth 1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider /tmp/bgutil
          cd /tmp/bgutil/server || exit 0
          npm install --no-audit --no-fund 2>&1 | tail -3
          npx tsc 2>&1 | tail -3
          nohup node build/main.js --port 4416 > /tmp/bgutil-server.log 2>&1 &
          sleep 6
          curl -s --max-time 5 http://127.0.0.1:4416/ping || echo "server ping failed"
          cat /tmp/bgutil-server.log | tail -5
          true

      - name: 多策略下载
        id: dl
        shell: bash
        run: |
          set +e
          OUT=/tmp/out; mkdir -p "$OUT"
          LOG="$LOGDIR/download.log"; : > "$LOG"
          YTD=$(command -v yt-dlp-nightly || command -v yt-dlp)
          echo "using: $YTD" | tee -a "$LOG"
          POT_HTTP="youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416"

          attempt () {
            local tag="$1"; shift
            local before=$(ls -1 "$OUT" 2>/dev/null | wc -l)
            echo "##### [$tag] $*" | tee -a "$LOG"
            timeout 420 "$@" >>"$LOG" 2>&1
            local rc=$?
            local after=$(ls -1 "$OUT" 2>/dev/null | wc -l)
            echo "##### [$tag] rc=$rc files:$before->$after" | tee -a "$LOG"
            if ls "$OUT"/*.mp4 "$OUT"/*.mkv "$OUT"/*.webm >/dev/null 2>&1; then
              echo "HIT=$tag" | tee -a "$LOG"; return 0
            fi
            return 1
          }

          COMMON=(--no-warnings --no-playlist --no-color --ignore-errors
                  --write-info-json --write-thumbnail --convert-thumbnails jpg
                  --write-auto-subs --sub-langs "zh.*,en.*" --retries 8 --socket-timeout 30
                  --extractor-args "$POT_HTTP"
                  -o "$OUT/%(title).70s.%(ext)s")

          done_ok=0
          # 1) PO token(script) + tv_simply（近年最不需要 token 的 client）
          [ $done_ok -eq 0 ] && attempt pot_tv_simply "$YTD" "${COMMON[@]}" \
            --extractor-args "youtube:player_client=tv_simply;fetch_pot=always" -f "bv*+ba/b" "$URL" && done_ok=1
          # 2) PO token(script) + default
          [ $done_ok -eq 0 ] && attempt pot_default "$YTD" "${COMMON[@]}" \
            --extractor-args "youtube:player_client=default;fetch_pot=always" -f "bv*+ba/b" "$URL" && done_ok=1
          # 3) android_vr（历史上一度免 token）
          [ $done_ok -eq 0 ] && attempt android_vr "$YTD" "${COMMON[@]}" \
            --extractor-args "youtube:player_client=android_vr" -f "b/bv*" "$URL" && done_ok=1
          # 4) 渐进式单文件 18/22/43（360p，最抗风控，Shorts 够用）
          [ $done_ok -eq 0 ] && attempt progressive "$YTD" "${COMMON[@]}" \
            --extractor-args "youtube:player_client=web,mweb,ios" -f "18/b[ext=mp4]/22/43/b" "$URL" && done_ok=1
          # 5) 缺 PO token 也硬下
          [ $done_ok -eq 0 ] && attempt missing_pot "$YTD" "${COMMON[@]}" \
            --extractor-args "youtube:player_client=default,tv;formats=missing_pot;fetch_pot=never" -f "b" "$URL" && done_ok=1
          # 6) cookies（若仓库配了 secret）
          if [ $done_ok -eq 0 ] && [ -n "${{ secrets.COOKIES_YOUTUBE }}" ]; then
            echo "${{ secrets.COOKIES_YOUTUBE }}" > /tmp/ck.txt
            attempt cookies "$YTD" "${COMMON[@]}" --cookies /tmp/ck.txt -f "bv*+ba/b" "$URL" && done_ok=1
          fi

          # 7) Invidious 公共实例：由它的服务器去取流
          if [ $done_ok -eq 0 ]; then
            echo "##### [invidious]" | tee -a "$LOG"
            for inv in https://inv.nadeko.net https://invidious.nerdvpn.de https://yewtu.be \
                       https://iv.melmac.space https://invidious.privacyredirect.com \
                       https://invidious.f5.si https://inv.tux.pizza https://invidious.jing.rocks; do
              for p in "/latest_version?id=$VID&itag=18" "/latest_version?id=$VID&itag=22"; do
                code=$(curl -sL --max-time 90 -o "$OUT/inv_try.mp4" -w "%{http_code}" "$inv$p" 2>>"$LOG")
                sz=$(stat -c%s "$OUT/inv_try.mp4" 2>/dev/null || echo 0)
                echo "   $inv$p -> http=$code size=$sz" | tee -a "$LOG"
                if [ "$code" = "200" ] && [ "$sz" -gt 200000 ]; then
                  mv "$OUT/inv_try.mp4" "$OUT/youtube_short_$VID.mp4"; done_ok=1; echo "HIT=invidious:$inv" | tee -a "$LOG"; break 2
                fi
                rm -f "$OUT/inv_try.mp4"
              done
            done
          fi

          # 8) Piped API 公共实例
          if [ $done_ok -eq 0 ]; then
            echo "##### [piped]" | tee -a "$LOG"
            for api in https://pipedapi.kavin.rocks https://pipedapi.adminforge.de \
                       https://api.piped.private.coffee https://pipedapi.reallyaweso.me; do
              js=$(curl -sL --max-time 40 "$api/streams/$VID" 2>>"$LOG")
              echo "$js" | head -c 300 >> "$LOG"; echo >> "$LOG"
              u=$(echo "$js" | jq -r '(.videoStreams // []) | sort_by(.bitrate // 0) | .[-1].url // empty' 2>/dev/null)
              [ -z "$u" ] && u=$(echo "$js" | jq -r '(.videoStreams // [])[0].url // empty' 2>/dev/null)
              if [ -n "$u" ]; then
                code=$(curl -sL --max-time 180 -o "$OUT/piped.mp4" -w "%{http_code}" "$u" 2>>"$LOG")
                sz=$(stat -c%s "$OUT/piped.mp4" 2>/dev/null || echo 0)
                echo "   $api -> http=$code size=$sz" | tee -a "$LOG"
                if [ "$sz" -gt 200000 ]; then mv "$OUT/piped.mp4" "$OUT/youtube_short_$VID.mp4"; done_ok=1; echo "HIT=piped:$api" | tee -a "$LOG"; break; fi
                rm -f "$OUT/piped.mp4"
              fi
            done
          fi

          # 9) cobalt 公共实例
          if [ $done_ok -eq 0 ]; then
            echo "##### [cobalt]" | tee -a "$LOG"
            for c in https://api.cobalt.tools https://co.wuk.sh https://cobalt-api.kwiatekmiki.com; do
              r=$(curl -s --max-time 60 -X POST "$c/" -H "Accept: application/json" -H "Content-Type: application/json" \
                  -A "Mozilla/5.0" -d "{\"url\":\"$URL\",\"videoQuality\":\"1080\"}" 2>>"$LOG")
              echo "   $c -> $r" | tee -a "$LOG"
              u=$(echo "$r" | jq -r '.url // empty' 2>/dev/null)
              if [ -n "$u" ] && [ "$u" != "null" ]; then
                curl -sL --max-time 300 -o "$OUT/cobalt.mp4" "$u" 2>>"$LOG"
                sz=$(stat -c%s "$OUT/cobalt.mp4" 2>/dev/null || echo 0)
                if [ "$sz" -gt 200000 ]; then mv "$OUT/cobalt.mp4" "$OUT/youtube_short_$VID.mp4"; done_ok=1; echo "HIT=cobalt:$c" | tee -a "$LOG"; break; fi
              fi
            done
          fi

          echo "DONE done_ok=$done_ok" | tee -a "$LOG"
          ls -la "$OUT" | tee -a "$LOG"
          echo "ok=$done_ok" >> "$GITHUB_OUTPUT"

      - name: 打包产物（≤18MB 分块）
        if: always()
        shell: bash
        run: |
          set -e
          D=media-raw/03_YouTube素材/$VID
          mkdir -p "$D"
          cp -f logs/download.log "$D/download.log" 2>/dev/null || true
          # 只保留真正的媒体/元数据，剔除试错残留
          find /tmp/out -maxdepth 1 -type f \( -name "*.mp4" -o -name "*.mkv" -o -name "*.webm" \
            -o -name "*.info.json" -o -name "*.jpg" -o -name "*.vtt" \) -size +2k \
            -exec cp -f {} "$D/" \; 2>/dev/null || true
          ls -la "$D" || true
          # 大文件按 18MB 切片，Agent 侧拼接
          cd "$D"
          for f in *.mp4 *.mkv *.webm; do
            [ -f "$f" ] || continue
            sz=$(stat -c%s "$f")
            if [ "$sz" -gt 18874368 ]; then
              split -b 18m -d -a 2 "$f" "$f.part."
              rm -f "$f"
              printf "%s\n" "$f" > "$f.reassemble"
            fi
          done
          ls -la . | head -30
          du -sh . || true

      - name: 推送到 media-out 分支
        if: always()
        shell: bash
        run: |
          set -x
          SRC="$GITHUB_WORKSPACE/media-raw"
          rm -rf /tmp/mo
          if ! git clone --quiet --branch media-out \
               "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" /tmp/mo; then
            mkdir -p /tmp/mo && cd /tmp/mo && git init -q && git checkout -q -b media-out
          fi
          cd /tmp/mo
          git config user.name "media-relay[bot]"
          git config user.email "media-relay[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          mkdir -p media-raw
          cp -r "$SRC"/. media-raw/
          git add -A
          if git diff --cached --quiet; then echo "nothing new"; else
            git commit -m "media: youtube $VID $(date -u +%Y-%m-%dT%H%M%SZ)"
            git push origin media-out
          fi

      - name: 同时存 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-short
          path: media-raw
          if-no-files-found: ignore
