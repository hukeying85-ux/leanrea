name: xhs-fetch
on:
  push:
    paths:
      - '.xhs-fetch/**'
      - '.github/workflows/xhs-fetch.yml'
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve image urls (fresh, avoids expired CDN signatures)
        run: |
          set -e
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
          NOTE='https://www.xiaohongshu.com/explore/6ae333e7000000002903c0c0?xsec_token=ABk9t7_aLq5JZiUliKCwRLUdEYfLHPQecOWdOkjtDQgpo=&xsec_source=pc_user'
          curl -sSL -m 60 -A "$UA" -H 'Accept-Language: zh-CN,zh;q=0.9' "$NOTE" -o note.html || true
          echo "note.html bytes=$(stat -c%s note.html 2>/dev/null || echo 0)"
          mkdir -p out
          grep -oE 'https://sns-webpic-qc\.xhscdn\.com/[^"[:space:]\\)]+' note.html \
            | grep 'notes_pre_post' | grep 'nd_dft_wlteh_webp_3' | sort -u > fresh.txt || true
          echo "fresh urls: $(wc -l < fresh.txt)"
          if [ "$(wc -l < fresh.txt)" -ge 5 ]; then cp fresh.txt urls.txt; else cp .xhs-fetch/urls.txt urls.txt; echo "FALLBACK to committed urls"; fi
          cat urls.txt
      - name: Download
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
          REF='https://www.xiaohongshu.com/explore/6ae333e7000000002903c0c0'
          i=0
          while IFS= read -r u; do
            [ -z "$u" ] && continue
            i=$((i+1)); n=$(printf "%02d" $i)
            code=$(curl -sSL -m 90 -A "$UA" -e "$REF" \
              -H 'Accept: image/avif,image/webp,image/apng,image/*,*/*;q=0.8' \
              -H 'Accept-Language: zh-CN,zh;q=0.9' \
              -o "out/xhs_${n}.webp" -w '%{http_code}' "$u" || echo 000)
            if [ "$code" != "200" ]; then
              base="${u%%!*}"
              code=$(curl -sSL -m 90 -A "$UA" -e "$REF" -o "out/xhs_${n}.webp" -w '%{http_code}' "$base" || echo 000)
              echo "  fallback-nosuffix http=$code"
            fi
            echo "img_${n}: http=${code} bytes=$(stat -c%s out/xhs_${n}.webp 2>/dev/null || echo 0)"
          done < urls.txt
      - name: Convert to png
        run: |
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq webp >/dev/null 2>&1 || true
          cd out
          for f in *.webp; do
            [ -e "$f" ] || continue
            s=$(stat -c%s "$f")
            if [ "$s" -gt 1000 ]; then dwebp "$f" -o "${f%.webp}.png" >/dev/null 2>&1 && rm -f "$f" || echo "dwebp FAIL $f"; else echo "TOO SMALL $f $s"; fi
          done
          echo "--- final ---"; ls -la; file * || true
      - uses: actions/upload-artifact@v4
        with:
          name: xhs-images
          path: out/
          if-no-files-found: error
      - name: Emit base64 fallback
        run: |
          cd out
          for f in *; do
            [ -e "$f" ] || continue
            echo "B64BEGIN:$f"
            base64 -w 200 "$f"
            echo "B64END:$f"
          done
