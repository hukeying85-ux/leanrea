name: xhs-relay

# 沙箱出口只放行 GitHub / PyPI / npm，抓不到小红书的页面和 CDN；Actions 的 runner
# 出网不受限。于是：把要抓的笔记写进 tools/xhs-relay/queue.json 推上来，runner 代为
# 下载，然后把结果 commit 回「同一条分支」（artifact 存在 blob.core.windows.net，
# 沙箱同样够不着，所以不用 artifact）。本地 git pull 即可拿到原图。
on:
  push:
    paths:
      - 'tools/xhs-relay/queue.json'
      - 'tools/xhs-relay/xhs_fetch.py'
      - 'tools/xhs-relay/secrets/*.enc'
      - '.github/workflows/xhs-relay.yml'
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      only_note:
        description: '只跑 queue.json 里包含这个 note_id 的任务（可选）'
        required: false
        default: ''
      force:
        description: '忽略已存在的 note.json，重新抓取'
        type: boolean
        default: false
      drive_upload_uri:
        description: '一次性 Google Drive resumable 上传地址（可选；把无水印原片视频直传 Drive，不进 git）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: xhs-relay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install --quiet --upgrade requests pillow

      # ---- 安全信道：私钥只活在 Actions cache 里（公众拿不到），公钥进仓库。
      #      沙箱用公钥加密一次性的 Drive 上传地址 → tools/xhs-relay/secrets/*.enc → runner 解密使用。
      - name: Relay key cache
        uses: actions/cache@v4
        with:
          path: ~/.xhs-relay
          key: xhs-relay-rsa-v1-${{ github.ref_name }}

      - name: Ensure relay key pair
        run: |
          mkdir -p ~/.xhs-relay
          if [ ! -f ~/.xhs-relay/key.pem ]; then
            echo "generating new relay key pair"
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out ~/.xhs-relay/key.pem 2>/dev/null
          fi
          openssl pkey -in ~/.xhs-relay/key.pem -pubout -out tools/xhs-relay/relay_pubkey.pem
          openssl pkey -pubin -in tools/xhs-relay/relay_pubkey.pem -outform DER | sha256sum | cut -c1-16

      - name: Decrypt per-job secrets
        run: |
          shopt -s nullglob
          for f in tools/xhs-relay/secrets/*.enc; do
            name=$(basename "$f" .enc)
            if val=$(base64 -d "$f" | openssl pkeyutl -decrypt -inkey ~/.xhs-relay/key.pem \
                       -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 2>/dev/null); then
              echo "::add-mask::$val"
              echo "$name=$val" >> "$GITHUB_ENV"
              echo "decrypted $name"
            else
              echo "::warning::cannot decrypt $f (relay key rotated? re-encrypt with the current relay_pubkey.pem)"
            fi
          done

      - name: Fetch notes in queue
        env:
          COOKIES_XHS: ${{ secrets.COOKIES_XHS }}   # 可选：登录态 cookie 字符串
          ONLY_NOTE: ${{ inputs.only_note }}
          FORCE: ${{ inputs.force }}
          DRIVE_UPLOAD_URI: ${{ inputs.drive_upload_uri }}
        run: |
          if [ -n "$DRIVE_UPLOAD_URI" ]; then echo "::add-mask::$DRIVE_UPLOAD_URI"; fi
          python tools/xhs-relay/xhs_fetch.py --queue tools/xhs-relay/queue.json 2>&1 | tee /tmp/xhs-relay.log
          # 用过的一次性密文删掉，避免下次重跑
          for f in tools/xhs-relay/secrets/*.used; do [ -e "$f" ] && git rm -q --cached "${f%.used}" 2>/dev/null; rm -f "${f%.used}" "$f"; done; true

      - name: Commit results back to this branch
        run: |
          git config user.name  "xhs-relay[bot]"
          git config user.email "xhs-relay[bot]@users.noreply.github.com"
          git config core.quotePath false   # 中文路径不转义，否则下面的扩展名计数永远是 0
          git add -A
          if git diff --cached --quiet; then
            echo "nothing new to commit"; exit 0
          fi
          n=$(git diff --cached --name-only | grep -cE '\.(png|jpe?g|webp|heic|avif|gif)$' || true)
          git commit -m "xhs-relay: fetched ${n} image(s) ($(date -u +%Y-%m-%dT%H%M%SZ))"
          # 工作分支可能在 runner 跑的时候又有新提交：最多重试 3 次 rebase 再推
          for i in 1 2 3; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || { git rebase --abort; exit 1; }
          done
          exit 1
