name: media-relay

# 沙箱出口只放行 GitHub/PyPI/npm，抓不到小红书/抖音/B站/YouTube。
# 这里把下载任务搬到 runner 上跑（runner 出网不受限），结果 commit 回来。
on:
  push:
    paths:
      - '.mediaqueue/**'
      - 'tools/media-library/**'
      - '.github/workflows/media-relay.yml'
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: media-relay
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install downloaders
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade yt-dlp gallery-dl requests
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          yt-dlp --version || true
          gallery-dl --version || true

      - name: Fetch everything in the queue
        run: |
          python tools/media-library/relay_worker.py 2>&1 | tee /tmp/relay.log

      - name: Publish results to the dedicated media-out branch
        if: always()
        env:
          COOKIES_DOUYIN: ${{ secrets.COOKIES_DOUYIN }}
          COOKIES_YOUTUBE: ${{ secrets.COOKIES_YOUTUBE }}
          COOKIES_BILIBILI: ${{ secrets.COOKIES_BILIBILI }}
          COOKIES_XHS: ${{ secrets.COOKIES_XHS }}
          COOKIES_INSTAGRAM: ${{ secrets.COOKIES_INSTAGRAM }}
          COOKIES_WEIBO: ${{ secrets.COOKIES_WEIBO }}
          COOKIES_KUAISHOU: ${{ secrets.COOKIES_KUAISHOU }}
        run: |
          # 结果单独放 media-out 分支：不写回工作分支，避免和本地提交反复冲突
          git config user.name  "media-relay[bot]"
          git config user.email "media-relay[bot]@users.noreply.github.com"
          # media-raw 是未跟踪目录，切分支不会被删掉，不需要 stash
          if git fetch origin media-out --depth=1 2>/dev/null; then
            git checkout -B media-out FETCH_HEAD
          else
            git checkout --orphan media-out
            git rm -rf --cached . >/dev/null 2>&1 || true
          fi
          ls -la media-raw | head -5
          git add -f media-raw || true
          if git diff --cached --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "media: relay run $(date -u +%Y-%m-%dT%H%M%SZ)"
            git push origin media-out || echo "push failed"
          fi

      - name: Upload as artifact too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-raw
          path: media-raw
          if-no-files-found: ignore
