name: media-relay

# 沙箱出口只放行 GitHub/PyPI/npm，抓不到小红书/抖音/B站/YouTube。
# 这里把下载任务搬到 runner 上跑（runner 出网不受限），结果 commit 回来。
on:
  push:
    paths:
      - '.mediaqueue/**'
      - 'tools/media-library/**'
      - '.github/workflows/media-relay.yml'
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: media-relay
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install downloaders
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade yt-dlp gallery-dl requests
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          yt-dlp --version || true
          gallery-dl --version || true

      - name: Fetch everything in the queue
        run: |
          python tools/media-library/relay_worker.py 2>&1 | tee /tmp/relay.log

      - name: Commit results back to the branch
        if: always()
        run: |
          git config user.name  "media-relay[bot]"
          git config user.email "media-relay[bot]@users.noreply.github.com"
          git add -f media-raw || true
          if git diff --cached --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "media: relay run $(date -u +%Y-%m-%dT%H%M%SZ)"
            git push origin HEAD:${{ github.ref_name }} || echo "push failed"
          fi

      - name: Upload as artifact too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-raw
          path: media-raw
          if-no-files-found: ignore
